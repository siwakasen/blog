name: 🚀 Redeploy To Kubernetes
on: workflow_dispatch

jobs:
  deploy:
    name: deploy to Kubernetes
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@master
        name: 🔽 Checkout

      - uses: actions-hub/kubectl@master
        name: 🛠️ Prepare Kubectl
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
      - uses: actions-hub/kubectl@master
        name: 🚀 Deploy to Kubernetes
        with:
          args:
            rollout restart deployment ${{ vars.DEPLOYMENT_NAME }} -n ${{
            vars.DEPLOYMENT_NAMESPACES }}
      - uses: actions-hub/kubectl@master
        name: 🧐 Verify Deployment
        with:
          args:
            rollout status deployment ${{ vars.DEPLOYMENT_NAME }} -n ${{
            vars.DEPLOYMENT_NAMESPACES }}
